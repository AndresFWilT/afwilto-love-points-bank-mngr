# Perfil de pruebas: base aislada en tmpfs (arranca y muere rápido, sin volumen).
# Se usa para el humo E2E (make test-e2e). Puertos distintos para no chocar con el
# perfil por defecto.

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: puntitos
      POSTGRES_USER: puntitos
      POSTGRES_PASSWORD: puntitos
      TZ: UTC
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puntitos -d puntitos"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate-test:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./data-base/migrations:/migrations:ro
    command:
      ["-path", "/migrations", "-database",
       "postgres://puntitos:puntitos@db-test:5432/puntitos?sslmode=disable", "up"]
    depends_on:
      db-test:
        condition: service_healthy
    restart: "no"

  api-test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://puntitos:puntitos@db-test:5432/puntitos?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: warn
    depends_on:
      db-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    ports:
      - "18080:8080"
